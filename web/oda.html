<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Uçan Hamam Böceği — Oda Daveti</title>
  <style>
    body {
      margin: 0; font-family: system-ui, sans-serif;
      background: #F6EFE4; color: #3D3530;
      display: flex; align-items: center; justify-content: center; min-height: 100vh;
    }
    .card {
      background: #FFFDF8; border: 4px solid #24160E; border-radius: 24px;
      padding: 28px; max-width: 420px; width: 90%; text-align: center;
      box-shadow: 0 8px 0 #24160E;
    }
    .code {
      font-size: 42px; font-weight: 900; letter-spacing: 6px;
      color: #D9605A; margin: 14px 0;
    }
    .btn {
      display: block; padding: 16px; border-radius: 16px; text-decoration: none;
      font-size: 20px; font-weight: 800; color: #24160E; border: 3px solid #24160E;
      background: #8FD17C; box-shadow: 0 4px 0 #24160E; margin: 12px 0;
    }
    .btn.sec { background: #F2C9A9; font-size: 16px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Uçan Hamam Böceği</h1>
    <p>Mutfakta yer açtım! Odaya katılmak için aşağıdaki kodu kullan:</p>
    <div id="code" class="code">----</div>
    <a id="openBtn" class="btn" href="#">Oyunu Aç</a>
    <a id="dlBtn" class="btn sec" href="#">Oyun yüklü değil mi? İndir</a>
  </div>
  <script>
    const DOWNLOAD_URL = "https://github.com/aykut/hamam-bocegi/releases";
    const PACKAGE_NAME = "com.aykut.ucanhamambocegi";
    const params = new URLSearchParams(window.location.search);
    const code = (params.get("k") || "KTRB").toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 4);
    document.getElementById("code").textContent = code;
    document.getElementById("dlBtn").href = DOWNLOAD_URL;
    const intentUrl = `intent://oda/${code}#Intent;scheme=ucanbocek;package=${PACKAGE_NAME};end`;
    document.getElementById("openBtn").href = intentUrl;
    window.location.replace(intentUrl);
  </script>
</body>
</html>
